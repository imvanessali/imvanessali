<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郦橙 Vanessa Li · imvanessali</title>
  <meta name="description" content="郦橙 / Vanessa Li — Nike 大中华区 AI 产品负责人，TikTok 最早的产品经理之一。">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-soft: #111113;
      --line: #1f1f23;
      --text: #ededee;
      --muted: #8b8b93;
      --accent: #4ade80;
      --accent-dim: rgba(74, 222, 128, 0.12);
      --mono: 'JetBrains Mono', 'Courier New', monospace;
      --sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.58;
      -webkit-font-smoothing: antialiased;
    }

    /* grid lines with a wave of opacity sweeping from top-left to bottom-right */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background-image:
        linear-gradient(#26262c 1px, transparent 1px),
        linear-gradient(90deg, #26262c 1px, transparent 1px);
      background-size: 72px 72px;
      -webkit-mask-image: linear-gradient(135deg,
        rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0.95) 14%, rgba(0, 0, 0, 0.18) 28%,
        rgba(0, 0, 0, 0.95) 42%, rgba(0, 0, 0, 0.18) 56%, rgba(0, 0, 0, 0.95) 70%,
        rgba(0, 0, 0, 0.18) 84%, rgba(0, 0, 0, 0.95) 98%);
      mask-image: linear-gradient(135deg,
        rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0.95) 14%, rgba(0, 0, 0, 0.18) 28%,
        rgba(0, 0, 0, 0.95) 42%, rgba(0, 0, 0, 0.18) 56%, rgba(0, 0, 0, 0.95) 70%,
        rgba(0, 0, 0, 0.18) 84%, rgba(0, 0, 0, 0.95) 98%);
      -webkit-mask-size: 300% 300%;
      mask-size: 300% 300%;
    }

    /* soft light in the background */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 20% 10%, rgba(74, 222, 128, 0.07), transparent 70%),
        radial-gradient(ellipse 60% 45% at 85% 90%, rgba(74, 222, 128, 0.05), transparent 70%);
    }

    ::selection { background: var(--accent); color: #0a0a0b; }

    /* ---------- nav ---------- */
    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(10, 10, 11, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .brand:hover { color: var(--accent); }
    .brand .dot { color: var(--accent); }

    .copy-ai-btn {
      font-family: var(--mono);
      font-size: 0.8rem;
      font-weight: 500;
      background: var(--accent);
      color: #0a0a0b;
      border: 1px solid var(--accent);
      padding: 0.5rem 1.15rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      animation: pulse 2.6s ease-out infinite;
    }
    .copy-ai-btn:hover { background: #86efb0; border-color: #86efb0; }
    .copy-ai-btn.copied { animation: none; opacity: 0.85; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.45); }
      70% { box-shadow: 0 0 0 12px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }

    /* ---------- layout ---------- */
    main {
      max-width: 840px;
      margin: 0 auto;
      padding: 0 1.5rem 6rem;
    }

    section { margin-top: 5.5rem; }

    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .reveal.visible { opacity: 1; transform: none; }

    .section-head {
      display: flex;
      align-items: baseline;
      gap: 0.9rem;
      margin-bottom: 1.8rem;
    }
    .section-num {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
    }
    .section-title {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* ---------- hero ---------- */
    .hero { margin-top: 6rem; }

    .hero .hello {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 1.2rem;
    }
    .hero .hello::before { content: '> '; }

    .hero h1 {
      font-size: clamp(2.6rem, 7vw, 4.2rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .hero h1 .en {
      display: block;
      font-size: 0.42em;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.12em;
      margin-top: 0.6rem;
    }

    .hero .roles {
      margin-top: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .hero .role {
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--muted);
    }
    .hero .role strong { color: var(--text); font-weight: 500; }
    .hero .role::before { content: '· '; color: var(--accent); }

    .hero .cursor {
      display: inline-block;
      width: 0.42em;
      height: 1.05em;
      background: var(--accent);
      vertical-align: -0.15em;
      margin-left: 0.15em;
      animation: blink 1.1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---------- contact ---------- */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.8rem;
    }
    .contact-item {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 1rem 1.1rem;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.2s, transform 0.2s;
    }
    .contact-item:hover { border-color: rgba(74, 222, 128, 0.5); transform: translateY(-2px); }
    .contact-item .platform {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }
    .contact-item .handle { font-size: 0.9rem; word-break: break-all; }
    .contact-item .hint {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .contact-item:hover .hint { opacity: 1; }

    /* ---------- plain list sections ---------- */
    .item-list { display: flex; flex-direction: column; }
    .item {
      display: flex;
      gap: 1rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--line);
    }
    .item:last-child { border-bottom: none; }
    .item .marker {
      font-family: var(--mono);
      color: var(--accent);
      font-size: 0.85rem;
      padding-top: 0.15rem;
      flex-shrink: 0;
    }
    .item .body { color: #c9c9cf; font-size: 0.95rem; }
    .item .body strong {
      display: block;
      color: var(--text);
      font-weight: 500;
      font-size: 1rem;
      margin-bottom: 0.25rem;
    }
    .item .body .sub { color: var(--muted); font-size: 0.88rem; }

    /* ---------- products ---------- */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.9rem;
    }
    .product-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding: 1.2rem 1.3rem;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none;
      color: var(--text);
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s;
    }
    .product-card:hover { border-color: rgba(74, 222, 128, 0.5); transform: translateY(-3px); }
    .product-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .product-card .name {
      font-weight: 500;
      font-size: 0.98rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .product-card .arrow {
      font-family: var(--mono);
      color: var(--accent);
      transition: transform 0.2s;
    }
    .product-card:hover .arrow { transform: translate(2px, -2px); }
    .product-card .desc { font-size: 0.82rem; color: var(--muted); }

    /* ---------- traces / podcasts ---------- */
    .trace {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      padding: 1.1rem 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      transition: padding-left 0.2s;
    }
    .trace:last-child { border-bottom: none; }
    .trace:hover { padding-left: 0.5rem; }
    .trace .show {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--accent);
    }
    .trace .title { font-size: 0.93rem; color: #c9c9cf; }
    .trace:hover .title { color: var(--text); }

    /* ---------- fun facts ---------- */
    .facts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
    }
    .fact {
      padding: 1rem 1.1rem;
      border: 1px dashed var(--line);
      border-radius: 10px;
      font-size: 0.88rem;
      color: #c9c9cf;
      transition: border-color 0.2s;
    }
    .fact:hover { border-color: rgba(74, 222, 128, 0.4); }
    .fact::before { content: '✳ '; color: var(--accent); font-family: var(--mono); }

    /* ---------- AI CTA panel ---------- */
    .ai-cta { margin-top: 2.2rem; }
    .ai-cta-inner {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.9rem;
      padding: 2rem 2.2rem;
      background: var(--bg-soft);
      border: 1px solid rgba(74, 222, 128, 0.35);
      border-radius: 12px;
    }
    .ai-cta-label {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      color: var(--accent);
    }
    .ai-cta-desc { font-size: 0.9rem; color: var(--muted); max-width: 56ch; }
    .ai-cta-inner .copy-ai-btn { margin-top: 0.4rem; font-size: 0.85rem; padding: 0.6rem 1.4rem; }

    @media (max-width: 600px) {
      nav { padding: 0.9rem 1.2rem; }
      .hero { margin-top: 4rem; }
      section { margin-top: 4rem; }
      .product-grid, .facts { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
      .hero .cursor { animation: none; }
      .copy-ai-btn { animation: none; }
    }
  </style>
</head>
<body>

  <nav>
    <a class="brand" href="/">imvanessa<span class="dot">.</span>li</a>
  </nav>

  <main>
    <section class="hero">
      <p class="hello">你好，我是</p>
      <h1>郦橙<span class="en">VANESSA LI · 锦妖<span class="cursor"></span></span></h1>
      <div class="roles" id="roles"></div>
    </section>
    <div id="sections"></div>
  </main>

  <script>
    // ---------- single source of truth: content.md ----------
    // Page sections are rendered from content.md at load time.
    // Edit content.md and the page updates automatically.

    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    // display names for known product URLs; unknown ones fall back to the hostname
    const productNames = {
      'getfoca.ai': 'Foca AI',
      'folderis.app': 'Folderis App',
      'imvanessa.li/d33p-research': 'D33p Research',
      'todo.imvanessa.li': 'Today or Not Today',
      'imvanessa.li/slides': 'HTML Slides Editor',
      'imvanessa.li/updowncard': 'UpDownCard',
      'imvanessa.li/speak': 'AI Speaking Coach',
      'imvanessa.li/infogalaxy': 'InfoGalaxy',
      'bit.ly/imvanessaliAI': 'AI 实践记录',
    };

    const platformLabels = {
      '微信': '微信 WeChat',
      '小红书': '小红书 RED',
      '抖音': '抖音 Douyin',
      '即刻': '即刻 Jike',
    };

    function parseMd(md) {
      const intro = [];
      const sections = [];
      let cur = null;
      for (const raw of md.split('\n')) {
        if (/^#\s/.test(raw)) continue; // skip the top-level title
        const h = raw.match(/^##\s+(.+)/);
        if (h) {
          cur = { name: h[1].trim(), items: [] };
          sections.push(cur);
          continue;
        }
        const line = raw.replace(/^>\s?/, '').trim();
        if (!line) continue;
        if (cur) cur.items.push(line); else intro.push(line);
      }
      return { intro, sections };
    }

    function parseLink(text) {
      const m = text.match(/^\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)$/);
      return m ? { label: m[1], url: m[2] } : null;
    }

    function productName(url) {
      try {
        const u = new URL(url);
        const path = u.pathname.replace(/\/+$/, '');
        const seg = path.split('/')[1] || '';
        return productNames[u.host + (seg ? '/' + seg : '')] || productNames[u.host] || u.host;
      } catch {
        return url;
      }
    }

    function renderContact(items) {
      const cards = items.map(item => {
        const m = item.match(/^(.+?)：(.+)$/);
        if (!m) return '';
        const [, platform, value] = m;
        const label = platformLabels[platform] || platform;
        const link = parseLink(value.trim());
        if (link) {
          return `<a class="contact-item" href="${esc(link.url)}" target="_blank" rel="noopener">
            <span class="platform">${esc(label)}</span>
            <span class="handle">${esc(link.label)}</span>
            <span class="hint">前往 ↗</span>
          </a>`;
        }
        return `<div class="contact-item" data-copy="${esc(value.trim())}">
          <span class="platform">${esc(label)}</span>
          <span class="handle">${esc(value.trim())}</span>
          <span class="hint">点击复制</span>
        </div>`;
      }).join('');
      return `<div class="contact-grid">${cards}</div>`;
    }

    function renderItemList(items, withSub) {
      const rows = items.map(item => {
        let body;
        const parts = withSub ? item.split(/\s+-\s+/) : null;
        if (withSub && parts.length > 1) {
          body = `<strong>${esc(parts[0])}</strong><span class="sub">${esc(parts.slice(1).join(' - '))}</span>`;
        } else {
          body = esc(item);
        }
        return `<div class="item"><span class="marker">→</span><p class="body">${body}</p></div>`;
      }).join('');
      return `<div class="item-list">${rows}</div>`;
    }

    function renderProducts(items) {
      const cards = items.map(item => {
        const m = item.match(/^(https?:\/\/\S+)\s*-\s*(.+)$/);
        if (!m) return '';
        const [, url, desc] = m;
        return `<a class="product-card" href="${esc(url)}" target="_blank" rel="noopener">
          <span class="name">${esc(productName(url))} <span class="arrow">↗</span></span>
          <span class="desc">${esc(desc)}</span>
        </a>`;
      }).join('');
      return `<div class="product-grid">${cards}</div>`;
    }

    function renderTraces(items) {
      const rows = items.map(item => {
        const link = parseLink(item);
        if (!link) return '';
        const parts = link.label.split(/\s+-\s+/);
        const show = parts[0].replace(/\s*播客$/, '');
        const title = parts.slice(1).join(' - ') || link.label;
        return `<a class="trace" href="${esc(link.url)}" target="_blank" rel="noopener">
          <span class="show">🎙 ${esc(show)}</span>
          <span class="title">${esc(title)}</span>
        </a>`;
      }).join('');
      return `<div>${rows}</div>`;
    }

    function renderFacts(items) {
      return `<div class="facts">${items.map(i => `<div class="fact">${esc(i)}</div>`).join('')}</div>`;
    }

    function renderSection(sec, index) {
      let body;
      if (/联系/.test(sec.name)) body = renderContact(sec.items);
      else if (/擅长/.test(sec.name)) body = renderItemList(sec.items, true);
      else if (/产品/.test(sec.name)) body = renderProducts(sec.items);
      else if (/痕迹/.test(sec.name)) body = renderTraces(sec.items);
      else if (/fun/i.test(sec.name)) body = renderFacts(sec.items);
      else body = renderItemList(sec.items, false);

      return `<section class="reveal">
        <div class="section-head">
          <span class="section-num">${String(index + 1).padStart(2, '0')}</span>
          <h2 class="section-title">${esc(sec.name)}</h2>
        </div>
        ${body}
      </section>`;
    }

    function renderRoles(intro) {
      document.getElementById('roles').innerHTML = intro.map(line => {
        const parts = line.split(/\s*\|\s*/);
        const main = esc(parts[0]);
        const rest = parts.slice(1).join(' | ');
        return `<p class="role"><strong>${main}</strong>${rest ? ' — ' + esc(rest) : ''}</p>`;
      }).join('');
    }

    // ---------- fetch + boot ----------
    let promptText = '';

    // CTA panel with the copy-for-AI button, inserted right after the contact section
    const aiCtaHtml = `<section class="reveal ai-cta">
      <div class="ai-cta-inner">
        <p class="ai-cta-label">FOR YOUR AI</p>
        <p class="ai-cta-desc">点击按钮复制一段提示词，粘贴给你的 AI。它会先问你的来意，再基于我的公开信息做一轮调研，帮你准备和我搭讪的开场白，或者替你对我的履历深挖提问。</p>
        <button class="copy-ai-btn" id="copyBtn">Copy prompt</button>
      </div>
    </section>`;

    Promise.all([
      fetch('content.md').then(r => r.text()),
      fetch('prompt.md').then(r => r.text())
    ]).then(([content, prompt]) => {
      promptText = prompt.replace('{{CONTEXT}}', content);

      const { intro, sections } = parseMd(content);
      renderRoles(intro);
      document.getElementById('sections').innerHTML = sections.map(renderSection).join('');

      // place the AI CTA right after the contact section (fallback: after the first section)
      const allSections = [...document.querySelectorAll('#sections section')];
      const contactSec = allSections.find(s => /联系/.test(s.querySelector('.section-title')?.textContent || '')) || allSections[0];
      if (contactSec) contactSec.insertAdjacentHTML('afterend', aiCtaHtml);

      // reveal on scroll
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
      }, { threshold: 0.08 });
      document.querySelectorAll('.reveal').forEach(el => io.observe(el));

      // click-to-copy contact cards
      document.querySelectorAll('[data-copy]').forEach(el => {
        el.addEventListener('click', async () => {
          await copyToClipboard(el.dataset.copy);
          const hint = el.querySelector('.hint');
          if (!hint) return;
          const original = hint.textContent;
          hint.textContent = '已复制 ✓';
          hint.style.opacity = 1;
          setTimeout(() => { hint.textContent = original; hint.style.opacity = ''; }, 1200);
        });
      });

      // copy-for-AI button
      const copyBtn = document.getElementById('copyBtn');
      const btnLabel = copyBtn.textContent;
      copyBtn.addEventListener('click', async () => {
        if (promptText) await copyToClipboard(promptText);
        copyBtn.textContent = 'Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = btnLabel; copyBtn.classList.remove('copied'); }, 2000);
      });
    }).catch(() => {});

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }
  </script>

</body>
</html>
